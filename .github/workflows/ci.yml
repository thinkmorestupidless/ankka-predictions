# Format, build and test on every pull request, as ankka-contrib does; the suites start a throwaway
# Postgres through testcontainers, which a GitHub-hosted runner can do. The features job checks the
# living features, the glossary and the specs that name them.
name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt scalafmtCheckAll scalafmtSbtCheck compile test

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - run: just check
